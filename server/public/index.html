<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#05071a" />
<title>NEON RUNNER</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>

<canvas id="gl"></canvas>
<div id="vignette"></div>

<!-- ═══ شاشة الدخول ═══ -->
<section class="screen" id="screen-auth">
  <div class="panel">
    <h1>NEON<span>RUNNER</span></h1>
    <div class="tabs">
      <button class="tab active" data-tab="login">دخول</button>
      <button class="tab" data-tab="register">حساب جديد</button>
    </div>
    <form id="authForm" autocomplete="on">
      <input id="fEmail" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required />
      <input id="fUser" type="text" placeholder="اسم المستخدم" minlength="3" maxlength="20"
             autocomplete="username" hidden />
      <input id="fPass" type="password" placeholder="كلمة المرور" minlength="8"
             autocomplete="current-password" required />
      <p class="err" id="authErr" hidden></p>
      <button class="primary" type="submit" id="authSubmit">تسجيل الدخول</button>
    </form>
    <button class="link" id="guestBtn">العب كضيف</button>
  </div>
</section>

<!-- ═══ القائمة ═══ -->
<section class="screen hidden" id="screen-menu">
  <div class="panel">
    <h1>NEON<span>RUNNER</span></h1>
    <p class="greet">مرحباً، <b id="mUser">—</b></p>
    <div class="stats">
      <div><span>الأفضل</span><strong id="mBest">0</strong></div>
      <div><span>الترتيب</span><strong id="mRank">—</strong></div>
      <div><span>الجولات</span><strong id="mGames">0</strong></div>
    </div>
    <button class="primary" id="playBtn">ابدأ اللعب</button>
    <div class="row">
      <button class="ghost" id="lbBtn">لوحة الصدارة</button>
      <button class="ghost" id="soundBtn">🔊 الصوت</button>
    </div>
    <button class="link danger" id="logoutBtn">تسجيل الخروج</button>
  </div>
</section>

<!-- ═══ لوحة الصدارة ═══ -->
<section class="screen hidden" id="screen-lb">
  <div class="panel">
    <h2>لوحة الصدارة</h2>
    <div class="lb" id="lbList"><p class="muted">جارٍ التحميل…</p></div>
    <button class="ghost" id="lbBack">رجوع</button>
  </div>
</section>

<!-- ═══ HUD ═══ -->
<div id="hud" class="hidden">
  <div class="stat"><span>النقاط</span><b id="hScore">0</b></div>
  <div class="stat gold"><span>الجواهر</span><b id="hGems">0</b></div>
  <div class="stat right"><span>السرعة</span>
    <div class="bar"><i id="hSpeed"></i></div>
  </div>
</div>

<!-- ═══ نهاية اللعبة + الإحياء ═══ -->
<section class="screen overlay hidden" id="screen-over">
  <div class="panel">
    <h2 class="dead">اصطدمت!</h2>
    <div class="stats">
      <div><span>النقاط</span><strong id="oScore">0</strong></div>
      <div><span>الجواهر</span><strong id="oGems">0</strong></div>
      <div><span>الأفضل</span><strong id="oBest">0</strong></div>
    </div>
    <p class="err" id="adErr" hidden></p>
    <button class="primary revive" id="reviveBtn">▶ شاهد إعلاناً وأكمل</button>
    <div class="row">
      <button class="ghost" id="againBtn">جولة جديدة</button>
      <button class="ghost" id="menuBtn">القائمة</button>
    </div>
    <p class="muted small" id="adNote"></p>
  </div>
</section>

<div id="toast" class="toast hidden"></div>

<script type="module" src="/app.js"></script>
</body>
</html>
